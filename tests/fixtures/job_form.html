<!doctype html>
<html>
<head><meta charset="utf-8"><title>Backend Engineer at Acme - Apply</title></head>
<body>
  <h1>Backend Engineer</h1>
  <p>Acme builds data pipelines in Python and PostgreSQL.</p>
  <form id="application" onsubmit="event.preventDefault(); document.title = 'Application received';">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="years">Years of experience</label>
    <select id="years" name="years">
      <option value="">Select...</option>
      <option value="0-2">0-2 years</option>
      <option value="3-5">3-5 years</option>
      <option value="6+">6+ years</option>
    </select>
    <fieldset>
      <legend>Are you willing to relocate?</legend>
      <label><input type="radio" name="relocate" value="yes"> Yes</label>
      <label><input type="radio" name="relocate" value="no"> No</label>
    </fieldset>
    <label for="why">Why do you want this role?</label>
    <textarea id="why" name="why"></textarea>
    <label for="salary">Salary expectation</label>
    <input id="salary" name="salary" type="text">
    <input type="hidden" name="token" value="abc">
    <input type="password" name="account_password">
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
